<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86">
  <defs>
    <!-- SailfishOS signature diagonal ocean-to-cyan gradient -->
    <linearGradient id="bgGrad" x1="0.3" y1="85.7" x2="85.7" y2="0.3" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B4B78"/>
      <stop offset="55%" stop-color="#1182B5"/>
      <stop offset="100%" stop-color="#22C1DC"/>
    </linearGradient>

    <!-- Subtle upper-left Sailfish Silica sheen -->
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- SailfishOS base shape: 3 rounded corners + 1 sharp bottom-left corner (0.3px margin) -->
    <clipPath id="baseClip">
      <path d="M 0.3,43 A 42.7,42.7 0 1,1 43,85.7 L 1.723,85.7 A 1.423,1.423 0 0,1 0.3,84.277 Z"/>
    </clipPath>

    <!-- Windshield clip -->
    <clipPath id="windshieldClip">
      <path d="M 27.0,23.5 L 59.0,23.5 Q 61.0,23.5 61.8,25.5 L 65.5,42.5 L 20.5,42.5 L 24.2,25.5 Q 25.0,23.5 27.0,23.5 Z"/>
    </clipPath>

    <!-- Car cutout mask for windshield, headlights, and grille -->
    <mask id="carMask">
      <rect x="0" y="0" width="86" height="86" fill="#FFFFFF"/>
      <path d="M 27.0,23.5 L 59.0,23.5 Q 61.0,23.5 61.8,25.5 L 65.5,42.5 L 20.5,42.5 L 24.2,25.5 Q 25.0,23.5 27.0,23.5 Z" fill="#000000"/>
      <circle cx="23.5" cy="51.0" r="3.6" fill="#000000"/>
      <circle cx="62.5" cy="51.0" r="3.6" fill="#000000"/>
      <rect x="35.5" y="49.5" width="15.0" height="3.0" rx="1.5" fill="#000000"/>
    </mask>
  </defs>

  <!-- Base shape -->
  <path d="M 0.3,43 A 42.7,42.7 0 1,1 43,85.7 L 1.723,85.7 A 1.423,1.423 0 0,1 0.3,84.277 Z"
        fill="url(#bgGrad)"/>

  <!-- Subtle diagonal sheen clipped to base shape -->
  <g clip-path="url(#baseClip)">
    <path d="M 0,0 L 86,0 L 0,86 Z" fill="url(#sheenGrad)"/>
  </g>

  <!-- Complete horizontal Sailfish silhouette in the driver's seat (inside windshield) -->
  <g clip-path="url(#windshieldClip)">
    <!-- Wide iconic Sailfish dorsal sail fin -->
    <path d="M 55.5,35.5 C 54.0,27.0 46.5,24.2 38.0,26.2 C 39.5,29.0 39.5,32.0 38.2,34.5 Z"
          fill="#FFFFFF" fill-opacity="0.58"/>

    <!-- Streamlined Sailfish body + forked crescent tail + thin spear bill -->
    <path d="M 24.5,35.8
             C 29.5,35.2 33.8,34.5 38.0,33.6
             C 44.5,32.5 51.0,33.0 56.8,36.0
             L 62.5,31.8
             C 61.0,35.0 60.8,37.2 61.6,38.8
             L 63.8,42.5
             C 60.5,41.0 58.2,39.8 56.5,38.6
             C 50.5,37.2 43.5,37.4 37.2,37.4
             C 33.5,37.4 29.2,36.8 24.5,35.8 Z"
          fill="#FFFFFF"/>

    <!-- Small pectoral fin -->
    <path d="M 42.0,37.2 L 46.8,41.2 C 44.5,40.8 41.8,39.5 39.8,37.3 Z"
          fill="#FFFFFF" fill-opacity="0.78"/>
  </g>

  <!-- Enlarged minimalist front-view car -->
  <g mask="url(#carMask)" fill="#FFFFFF">
    <!-- Cabin -->
    <path d="M 25.0,19.0 L 61.0,19.0 Q 64.0,19.0 65.2,22.0 L 70.0,43.0 L 16.0,43.0 L 20.8,22.0 Q 22.0,19.0 25.0,19.0 Z"/>
    <!-- Body -->
    <rect x="13.5" y="42.5" width="59.0" height="17.0" rx="4.8"/>
    <!-- Wheels -->
    <rect x="18.0" y="58.0" width="10.5" height="11.5" rx="3.0"/>
    <rect x="57.5" y="58.0" width="10.5" height="11.5" rx="3.0"/>
  </g>
</svg>
